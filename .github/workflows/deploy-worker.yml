name: Deploy Beauty by Layna Worker

on:
  workflow_dispatch:
  push:
    branches: [workers-preview, main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.ref == 'refs/heads/workers-preview' &&
        (github.event_name == 'workflow_dispatch' || vars.ENABLE_WORKERS_PREVIEW == 'true')) ||
      (github.ref == 'refs/heads/main' && vars.ENABLE_WORKERS_PRODUCTION == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'workers-production' || 'workers-preview' }}
    concurrency:
      group: beauty-by-layna-worker-${{ github.ref_name }}
    env:
      WRANGLER_SEND_METRICS: 'false'
      DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Generate target configuration
        env:
          CLOUDFLARE_PREVIEW_D1_ID: ${{ vars.CLOUDFLARE_PREVIEW_D1_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
        run: npm run worker:config -- "$DEPLOY_TARGET"
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the Cloudflare account ID in the GitHub environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set the Cloudflare API token in the GitHub environment}"
          npx --no-install wrangler deploy --config ".wrangler.${DEPLOY_TARGET}.json"
